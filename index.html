function buses(ctx,dest,vol){const m=ctx.createGain();m.gain.value=vol.m;m.connect(dest);const mk=v=>{const g=ctx.createGain();g.gain.value=v;g.connect(m);return g};return{m,narr:mk(vol.n),fx:mk(vol.f*.7)}} // fx bus fixed −3 dB under narration (static ducking)
function sched(ctx,B,from,w0){const out=[];for(const c of CUES()){const buf=c.k=='buf'?AB[c.key]:null;const dur=c.dur||(buf?buf.duration-(c.off||0):.2),end=c.t+dur;if(c.t+dur<=from)continue;
  const st=Math.max(c.t,from),w=w0+(st-from),o=(c.off||0)+(st-c.t),rem=dur-(st-c.t);const g=ctx.createGain(),v=c.gain??.5;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v,w+.03);if(rem>.25){g.gain.setValueAtTime(v,w+rem-.1);g.gain.linearRampToValueAtTime(0,w+rem)}
  g.connect(B[c.bus||'fx']);let head=g;
  if(c.k=='buf'){const s=ctx.createBufferSource();s.buffer=buf;s.playbackRate.value=c.rate||1;let n=s;
   if(c.lp){const f=ctx.createBiquadFilter();f.frequency.value=c.lp;n.connect(f);n=f}
   if(c.lfo){const m=ctx.createGain();m.gain.value=1-c.lfo.d*.5;const l=ctx.createOscillator();l.frequency.value=c.lfo.r;const lg=ctx.createGain();lg.gain.value=c.lfo.d*.5;l.connect(lg);lg.connect(m.gain);l.start(w);l.stop(w+rem+.1);out.push(l);n.connect(m);n=m}
   n.connect(g);s.start(w,o,rem);out.push(s)}
  else{const os=ctx.createOscillator();os.type=c.k=='beep'?'sine':'sawtooth';if(c.k=='beep')os.frequency.value=c.f;else{os.frequency.setValueAtTime(c.f0,w);os.frequency.linearRampToValueAtTime(c.f1,w+rem)}

 return out}
let playing=false,live=[],tStart=0,aStart=0,B=null;
const vol=()=>({m:+$('vm').value,n:+$('vn').value,f:+$('vf').value});
function stopAudio(){live.forEach(s=>{try{s.stop()}catch(e){}});live=[]}
function startAudio(from){stopAudio();B=buses(actx,actx.destination,vol());aStart=actx.currentTime+.05;tStart=from;live=sched(actx,B,from,aStart)}
['vm','vn','vf'].forEach(id=>$(id).oninput=()=>{if(playing){const v=vol();B.m.gain.value=v.m;B.narr.gain.value=v.n;B.fx.gain.value=v.f*.7}});
function play(){if(playing)return;if(T>=total-.05)T=0;actx.resume();playing=true;startAudio(T);$('play').textContent='❚❚ Pause';loop()}
function pause(){playing=false;stopAudio();$('play').textContent='▶ Play'}
function loop(){if(!playing)return;const t=tStart+Math.max(0,actx.currentTime-aStart);if(t>=total){setFrame(total-.001);pause();return}setFrame(t);requestAnimationFrame(loop)}
function seek(t){T=clamp(t,0,total-.001);setFrame(T);if(playing)startAudio(T)}

 if(D>old-9){const m0=scenes.find(s=>s.id=='M').t0,span=D-m0,ow=old-m0;scenes.forEach(s=>{if(s.t0>=m0)s.t0=m0+(s.t0-m0)/ow*span});total=D+.8}
 relink();buildTimingUI()}
$('nf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pause();status('Decoding narration…');AB.narr=await actx.decodeAudioData(await f.arrayBuffer());retimeToNarration();status(`Narration loaded: ${AB.narr.duration.toFixed(1)} s. Check scene timing panel and adjust if needed.`);setFrame(0)}catch(err){status('Could not decode that file: '+err.message)}};
function buildTimingUI(){$('tmed').innerHTML='';$('scsel').innerHTML='';scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=s.id;o.textContent=`${s.id} · ${s.name}`;$('scsel').append(o);
 const l=document.createElement('span');l.textContent=`${s.id} ${s.name}`;const n=document.createElement('input');n.type='number';n.step='.1';n.value=s.t0.toFixed(1);n.onchange=()=>{s.t0=+n.value;scenes.sort((a,b)=>a.t0-b.t0);relink();setFrame(T)};$('tmed').append(l,n)});
 const l=document.createElement('span');l.textContent='END';const n=document.createElement('input');n.type='number';n.step='.1';n.value=total.toFixed(1);n.onchange=()=>{total=+n.value;relink()};$('tmed').append(l,n)}
$('scsel').onchange=e=>seek(scenes.find(s=>s.id==e.target.value).t0+.01);

/* ===================== EXPORT (deterministic frame-by-frame, WebCodecs + mp4-muxer) ===================== */
async function exportMP4(){
 if(!('VideoEncoder' in window&&'AudioEncoder' in window))return status('This browser has no WebCodecs encoder. Use desktop Chrome or Edge for MP4 export.');
 pause();const prog=m=>status(m);try{
 prog('Rendering audio mix…');const sr=48000,oc=new OfflineAudioContext(2,Math.ceil(total*sr),sr),ob=buses(oc,oc.destination,vol());sched(oc,ob,0,0);const mix=await oc.startRendering();
 const{Muxer,ArrayBufferTarget}=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs');
 const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},audio:{codec:'aac',numberOfChannels:2,sampleRate:sr},fastStart:'in-memory'});
 const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{throw e}}),cfg={codec:'avc1.64002A',width:W,height:H,bitrate:9e6,framerate:FPS};
 if(!(await VideoEncoder.isConfigSupported(cfg)).supported)throw new Error('H.264 1080×1920 not supported by this browser');ve.configure(cfg);
 const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{throw e}});ae.configure({codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,bitrate:192000});
 const L=mix.getChannelData(0),Rr=mix.getChannelData(1),CH=4800;for(let i=0;i<L.length;i+=CH){const n=Math.min(CH,L.length-i),d=new Float32Array(n*2);d.set(L.subarray(i,i+n),0);d.set(Rr.subarray(i,i+n),n);const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/sr*1e6),data:d});ae.encode(ad);ad.close()}
 setQuality(H);const comp=document.createElement('canvas');comp.width=W;comp.height=H;const cx=comp.getContext('2d'),N=Math.round(total*FPS);
 for(let i=0;i<N;i++){setFrame(i/FPS);cx.drawImage($('cv'),0,0,W,H);cx.drawImage($('ov'),0,0);const f=new VideoFrame(comp,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(f,{keyFrame:i%60==0});f.close();
  while(ve.encodeQueueSize>8)await new Promise(r=>setTimeout(r,4));if(i%6==0){prog(`Exporting frame ${i+1}/${N} (${Math.round(i/N*100)}%)`);await new Promise(r=>setTimeout(r,0))}}
 await ve.flush();await ae.flush();muxer.finalize();const url=URL.createObjectURL(new Blob([muxer.target.buffer],{type:'video/mp4'})),a=document.createElement('a');a.href=url;a.download='johns-engineering-disasters-ep01-turbocharger.mp4';a.click();prog(`Export complete: ${N} frames, ${total.toFixed(1)} s, 1080×1920 @ ${FPS} fps.`)
 }catch(e){status('Export failed: '+e.message)}finally{setQuality(+$('q').value);setFrame(T)}}
$('exp').onclick=exportMP4;
